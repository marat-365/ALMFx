name: VS Code extension CI

on:
  push:
    branches: [main]
    paths:
      - 'src/vscode/**'
      - '.github/workflows/ci-vscode.yml'
  pull_request:
    paths:
      - 'src/vscode/**'
      - '.github/workflows/ci-vscode.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: src/vscode/almfx

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/vscode/almfx/package-lock.json

      - run: npm ci

      - name: Compile
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Guard against wildcard activation
        run: |
          if grep -q '"\*"' <(node -p "JSON.stringify(require('./package.json').activationEvents)"); then
            echo '::error::activationEvents must not contain "*" - it activates the extension on every window.'
            exit 1
          fi
