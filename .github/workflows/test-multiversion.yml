name: Test ALMFx Module (PS 5 + PS 7)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Intentionally no `paths:` filter: this workflow's job is used as a required
# branch-protection status check for auto-merge. A path-filtered required
# check that never runs on a given PR would leave that PR's merge blocked
# forever (GitHub has no "skipped" state for required checks), so every PR
# targeting main must produce a result here regardless of which files it
# touches.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-ps5:
    name: Test on PowerShell 5.1 (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Install Pester and PSScriptAnalyzer if not already present
          $requiredModules = 'Pester', 'PSScriptAnalyzer'
          foreach ($module in $requiredModules) {
            if (-not (Get-Module $module -ListAvailable)) {
              Write-Host "Installing $module..."
              Install-Module $module -Scope CurrentUser -Force -ErrorAction Stop
            }
          }

      - name: Run Tests (PS 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          . .\testplaygrounds\test-module.ps1
          Test-ALMFxModule -Verbose
        env:
          GITHUB_ACTIONS: 'true'

  test-ps7:
    name: Test on PowerShell 7+ (Core)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # windows-latest ships with a current PowerShell 7.x (pwsh) preinstalled;
      # no setup action is used or required. See:
      # https://github.com/actions/runner-images/blob/main/images/windows/Windows2022-Readme.md
      - name: Report PowerShell version
        shell: pwsh
        run: $PSVersionTable

      - name: Install Dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Install Pester and PSScriptAnalyzer if not already present
          $requiredModules = 'Pester', 'PSScriptAnalyzer'
          foreach ($module in $requiredModules) {
            if (-not (Get-Module $module -ListAvailable)) {
              Write-Host "Installing $module..."
              Install-Module $module -Scope CurrentUser -Force -ErrorAction Stop
            }
          }

      - name: Run Tests (PS 7+)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . .\testplaygrounds\test-module.ps1
          Test-ALMFxModule -Verbose
        env:
          GITHUB_ACTIONS: 'true'

  cross-version-report:
    name: Cross-Version Compatibility Report
    runs-on: windows-latest
    needs: [test-ps5, test-ps7]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Evaluate upstream results
        shell: pwsh
        run: |
          $ps5 = '${{ needs.test-ps5.result }}'
          $ps7 = '${{ needs.test-ps7.result }}'

          Write-Host "PowerShell 5.1 job result: $ps5"
          Write-Host "PowerShell 7+ job result:  $ps7"

          if ($ps5 -ne 'success' -or $ps7 -ne 'success') {
              Write-Host "✗ One or more version jobs did not succeed." -ForegroundColor Red
              exit 1
          }

          Write-Host "✓ All PowerShell versions passed tests" -ForegroundColor Green
          Write-Host "`nCompatibility Matrix:" -ForegroundColor Cyan
          Write-Host "  - PowerShell 5.1 (Windows): PASS" -ForegroundColor Green
          Write-Host "  - PowerShell 7.2+: PASS" -ForegroundColor Green
          Write-Host "`nModule is compatible with both Desktop and Core editions." -ForegroundColor Cyan

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const ps5 = '${{ needs.test-ps5.result }}';
            const ps7 = '${{ needs.test-ps7.result }}';
            const passed = ps5 === 'success' && ps7 === 'success';
            const body = passed
              ? '✓ **Multi-Version Tests Passed**\n\n- PowerShell 5.1 (Windows): ✓\n- PowerShell 7.2+: ✓\n\nModule is compatible with both Desktop and Core editions.'
              : `✗ **Multi-Version Tests Failed**\n\n- PowerShell 5.1 (Windows): ${ps5}\n- PowerShell 7.2+: ${ps7}\n\nSee the workflow run for details.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })
